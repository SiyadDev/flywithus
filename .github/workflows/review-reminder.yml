name: Weekly review check

# Every Monday 9:00 am India time, open a reminder issue asking the owner to
# check the Google rating. The issue lists the website's current numbers and links
# to the update form (.github/ISSUE_TEMPLATE/update-reviews.yml), where empty boxes
# keep the current values.
# If last week's reminder is still open, it posts a nudge comment on it instead.
on:
  schedule:
    - cron: '30 3 * * 1' # 03:30 UTC = 09:00 IST, Mondays
  workflow_dispatch:

permissions:
  issues: write
  contents: write # only to re-sync the update form if reviews.json was edited by hand

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make sure the update form shows the website's current numbers
        run: |
          node scripts/render-review-form.mjs
          if ! git diff --quiet -- .github/ISSUE_TEMPLATE/update-reviews.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .github/ISSUE_TEMPLATE/update-reviews.yml
            git commit -m "Sync review form with reviews.json"
            git push
          fi

      - name: Open the reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ASSIGNEES: ${{ vars.REVIEW_ASSIGNEES || github.repository_owner }}
        run: |
          gh label create review-check --color FFC629 --description "Weekly Google review check" --force -R "$REPO"
          gh label create review-update --color 1E8FE1 --description "New Google numbers for the website" --force -R "$REPO"

          rating=$(jq -r .rating src/data/reviews.json)
          count=$(jq -r .count src/data/reviews.json)
          b5=$(jq -r .breakdown.five src/data/reviews.json)
          b4=$(jq -r .breakdown.four src/data/reviews.json)
          b3=$(jq -r .breakdown.three src/data/reviews.json)
          b2=$(jq -r .breakdown.two src/data/reviews.json)
          b1=$(jq -r .breakdown.one src/data/reviews.json)
          updated=$(jq -r .updatedAt src/data/reviews.json)
          # Update form. (Not pre-filled via the link: GitHub keeps re-filling link values, so they can't be edited.)
          form="https://github.com/$REPO/issues/new?template=update-reviews.yml"
          google="https://www.google.com/search?q=FLY+WITH+US+TOURS+%26+TRAVELS+Mannarkkad+reviews"

          # Forgot last week? Don't open a second issue; comment on the open one instead.
          # The comment emails the assignees again, with this week's link.
          open=$(gh issue list -R "$REPO" --label review-check --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            cat > nudge.md <<EOF
          ⏰ **Still waiting. This is this week's reminder.**

          **On the website now:** **$rating★** from **$count reviews** · 5★ $b5 · 4★ $b4 · 3★ $b3 · 2★ $b2 · 1★ $b1

          1. [Check our Google reviews]($google)
          2. If anything changed → [**update the numbers**]($form). Type only what changed; empty boxes keep the numbers above.

          Nothing changed? Just close this issue.
          EOF
            gh issue comment "$open" -R "$REPO" --body-file nudge.md
            echo "Reminder #$open was still open; posted a nudge instead of a new issue."
            exit 0
          fi

          cat > body.md <<EOF
          ### 2-minute check ⭐

          **On the website now** (last updated $updated):
          **$rating★** from **$count reviews** · 5★ $b5 · 4★ $b4 · 3★ $b3 · 2★ $b2 · 1★ $b1

          **1. See the latest numbers on Google →** [open our Google reviews]($google)
          Note the rating, the total number of reviews, and how many there are for each star (5★ to 1★).

          **2. If anything changed →** [**update the numbers**]($form)
          Type **only the numbers that changed** and leave the other boxes empty (empty = keep the number above), then submit.
          The website updates itself a couple of minutes later, and this issue closes automatically.

          **Nothing changed?** Just close this issue.

          _Want fresh review quotes on the site? Ask your developer. The quotes are picked by hand._
          EOF

          # Assigning guarantees an email (assignees are notified even if they don't watch the repo).
          # To notify the business owner too, set repo variable REVIEW_ASSIGNEES, e.g. "SiyadDev,ownerlogin".
          gh issue create -R "$REPO" --title "Weekly review check · $(date -u +%d\ %b\ %Y)" --label review-check \
            --assignee "$ASSIGNEES" --body-file body.md
