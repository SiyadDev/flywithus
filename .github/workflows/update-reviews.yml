name: Update reviews

# A simple form (Actions → Update reviews → Run workflow) for typing in the
# latest Google numbers. It updates src/data/reviews.json and pushes to main;
# Cloudflare then rebuilds the live site automatically.
on:
  workflow_dispatch:
    inputs:
      rating:
        description: 'Google rating (e.g. 4.9)'
        required: true
        type: string
      count:
        description: 'Total number of reviews (e.g. 121)'
        required: true
        type: string
      five:
        description: 'How many 5★ reviews'
        required: true
        type: string
      four:
        description: 'How many 4★ reviews'
        required: true
        type: string
        default: '0'
      three:
        description: 'How many 3★ reviews'
        required: true
        type: string
        default: '0'
      two:
        description: 'How many 2★ reviews'
        required: true
        type: string
        default: '0'
      one:
        description: 'How many 1★ reviews'
        required: true
        type: string
        default: '0'

permissions:
  contents: write
  issues: write

concurrency:
  group: update-reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # enables pipefail, so a rejected form stops the run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Write the new numbers
        env:
          RATING: ${{ inputs.rating }}
          COUNT: ${{ inputs.count }}
          FIVE: ${{ inputs.five }}
          FOUR: ${{ inputs.four }}
          THREE: ${{ inputs.three }}
          TWO: ${{ inputs.two }}
          ONE: ${{ inputs.one }}
        run: node scripts/apply-review-numbers.mjs | tee result.txt

      - name: Save to the repository
        env:
          COUNT: ${{ inputs.count }}
          RATING: ${{ inputs.rating }}
        run: |
          if git diff --quiet -- src/data/reviews.json; then
            echo "No change to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          node scripts/render-review-form.mjs   # keep the issue form's "Website now" numbers in sync
          git add src/data/reviews.json .github/ISSUE_TEMPLATE/update-reviews.yml
          git commit -m "Update Google reviews: $COUNT reviews, $RATING★"
          git push

      - name: Close the weekly reminder
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list -R "$REPO" --label review-check --state open --json number --jq '.[].number'); do
            gh issue close "$n" -R "$REPO" --comment "✅ $(cat result.txt)"
          done
